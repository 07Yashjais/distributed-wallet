# ============================================
# Render Blueprint - Distributed Wallet System
# ============================================

services:
  # --------------------------------------------
  # 1. Backend API (Node.js Web Service)
  # --------------------------------------------
  - type: web
    name: distributed-wallet-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: distributed-wallet-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false # Set to Upstash / Cloud Redis URL (e.g. rediss://...)
      - key: KAFKA_BROKER
        sync: false # Set to Upstash / Confluent Kafka broker
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_SASL_MECHANISM
        value: "scram-sha-256"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # --------------------------------------------
  # 2. Frontend Web Client (React Static Site)
  # --------------------------------------------
  - type: web
    name: distributed-wallet-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your backend API URL, e.g. https://distributed-wallet-api.onrender.com/api

# --------------------------------------------
# 3. PostgreSQL Managed Database
# --------------------------------------------
databases:
  - name: distributed-wallet-db
    plan: free
    databaseName: wallet_db
    user: wallet_user
