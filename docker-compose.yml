services:
  # ============================================
  # 1. Redis Cache & Rate Limiting Store
  # (Bound to 127.0.0.1 to avoid public exposure)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: wallet-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wallet-network
    restart: unless-stopped

  # ============================================
  # 2. Apache Kafka (KRaft Mode - Zero Zookeeper)
  # (Port 9092 internal only; 29092 on localhost only)
  # ============================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: wallet-kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - wallet-network
    restart: unless-stopped

  # ============================================
  # 3. Backend HTTP API Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:9092
      - KAFKA_SSL=false
      - JWT_SECRET=${JWT_SECRET:-distributed_wallet_jwt_secret_dev}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wallet-network
    restart: unless-stopped

  # ============================================
  # 4. Transactional Outbox Worker
  # ============================================
  outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet-outbox-worker
    command: ["node", "src/workers/outboxWorker.js"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - KAFKA_BROKER=kafka:9092
      - KAFKA_SSL=false
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - wallet-network
    restart: unless-stopped

  # ============================================
  # 5. Kafka Transaction Consumer Worker
  # ============================================
  transaction-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet-transaction-worker
    command: ["node", "src/workers/transactionWorker.js"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - KAFKA_BROKER=kafka:9092
      - KAFKA_SSL=false
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - wallet-network
    restart: unless-stopped

  # ============================================
  # 6. Frontend Client (React + Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: wallet-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wallet-network
    restart: unless-stopped

networks:
  wallet-network:
    driver: bridge
