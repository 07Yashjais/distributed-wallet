services:
  # ============================================
  # 1. PostgreSQL Database Service
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-wallet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wallet_password}
      POSTGRES_DB: ${DB_NAME:-wallet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wallet_user} -d ${DB_NAME:-wallet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-network

  # ============================================
  # 2. Redis Cache Service
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: wallet-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wallet-network

  # ============================================
  # 3. Apache Kafka (KRaft Mode - No Zookeeper)
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: wallet-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - wallet-network

  # ============================================
  # 4. Backend API Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://wallet_user:wallet_password@postgres:5432/wallet_db}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:29092}
      JWT_SECRET: ${JWT_SECRET:-distributed_wallet_secret_key_change_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wallet-network

  # ============================================
  # 5. Outbox Worker (Transactional Outbox)
  # ============================================
  outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet-outbox-worker
    restart: unless-stopped
    command: ["node", "src/workers/outboxWorker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://wallet_user:wallet_password@postgres:5432/wallet_db}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:29092}
      JWT_SECRET: ${JWT_SECRET:-distributed_wallet_secret_key_change_in_production}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - wallet-network

  # ============================================
  # 6. Transaction Worker (Kafka Consumer)
  # ============================================
  transaction-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wallet-transaction-worker
    restart: unless-stopped
    command: ["node", "src/workers/transactionWorker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://wallet_user:wallet_password@postgres:5432/wallet_db}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:29092}
      JWT_SECRET: ${JWT_SECRET:-distributed_wallet_secret_key_change_in_production}
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - wallet-network

  # ============================================
  # 7. Frontend Web Client (React + Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: wallet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - wallet-network

# ============================================
# Persistent Storage Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

# ============================================
# Bridge Network
# ============================================
networks:
  wallet-network:
    driver: bridge
